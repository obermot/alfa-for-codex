
name: Nezabudka Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private Nezabudka source
        uses: actions/checkout@v4
        with:
          repository: obermot/nezabudka-for-codex
          ref: 140fb1cf91afc83f4d2f74eee6cad734ace3866c
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Save APK for 30 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nezabudka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
