name: Alpha 3 evidence verification
on:
  push:
    branches: [alpha-3]
    paths: [alpha3/evidence-launch.json]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alpha3-android-and-screen-matrix
          run-id: 45310893223
          github-token: ${{ github.token }}
          path: evidence
      - name: Verify saved evidence without rebuilding or running tests
        shell: python
        run: |
          import pathlib, json, hashlib, struct, xml.etree.ElementTree as E
          root=pathlib.Path('evidence')
          out=pathlib.Path('inspection');out.mkdir()
          manifest=json.loads((root/'alpha3-evidence/inventory.json').read_text())
          missing=[];mismatches=[]
          for row in manifest:
              p=root/row['path']
              if not p.is_file():missing.append(row['path']);continue
              if p.stat().st_size!=row['bytes'] or hashlib.sha256(p.read_bytes()).hexdigest()!=row['sha256']:
                  mismatches.append(row['path'])
          inventory=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (out/'archive-files-sha256.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2))
          coverage=json.loads((root/'alpha3-evidence/baseline-android-coverage.json').read_text())
          xml=next((root/'alpha3-evidence/baseline-android-results').rglob('TEST-*.xml'))
          cases=list(E.parse(xml).iter('testcase'));failures=[]
          for c in cases:
              f=c.find('failure')
              if f is not None:
                  row={'id':c.get('classname')+'.'+c.get('name'),'diagnostic':f.text or ''}
                  failures.append(row)
          (out/'baseline-failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2))
          phases={}
          for phase in ['unresolved','short-owner','compact-font','short-large-font-dark-system','tall-dense']:
              directory=root/'alpha3-evidence'/phase
              result=json.loads((directory/'summary.json').read_text())
              result['tests']=[{'id':c.get('classname')+'.'+c.get('name'),'passed':c.find('failure') is None,'diagnostic':(c.find('failure').text or '') if c.find('failure') is not None else ''} for c in E.parse(directory/'TEST-diagnostics.xml').iter('testcase')]
              phases[phase]=result
          screenshots=[]
          for p in (root/'alpha3-evidence/baseline-device').rglob('*.full.png'):
              b=p.read_bytes();assert b[:8]==b'\x89PNG\r\n\x1a\n',p
              screenshots.append({'name':p.name,'size':struct.unpack('>II',b[16:24]),'bytes':len(b)})
          apks=[x for x in inventory if x['path'].endswith('.apk')]
          captures={str(p.relative_to(root)):p.read_text() for p in root.rglob('*.capture-status.txt') if p.read_text().strip()!='OK'}
          palette_files=[p for p in root.rglob('*icon-colours.json') if 'unresolved-device' in str(p)]
          palette={p.name:json.loads(p.read_text()) for p in palette_files}
          videos=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size} for p in root.rglob('*.mp4')]
          summary={'source_run':45310893223,'provenance':json.loads((root/'alpha3-evidence/provenance.json').read_text()),
              'archive_files':len(inventory),'recorded_inventory_rows':len(manifest),'listed_files_not_uploaded':missing,
              'checksum_mismatches':mismatches,'baseline':{k:v for k,v in coverage.items() if k!='tests'},
              'baseline_xml_cases':len(cases),'baseline_failures':[{'id':x['id'],'diagnostic':x['diagnostic'][:1600]} for x in failures],
              'phases':phases,'full_screenshots':screenshots,'capture_errors':captures,'apks':apks,
              'individual_baseline_logcat':len([p for p in (root/'app/build/outputs/androidTest-results').rglob('*') if p.is_file() and 'logcat' in p.name and p.suffix=='.txt']),
              'general_logcat_bytes':(root/'alpha3-evidence/android-logcat-live.txt').stat().st_size,
              'icon_palettes':palette,'startup_videos':videos}
          (out/'inspection.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          brief=dict(summary);brief['full_screenshots_count']=len(brief.pop('full_screenshots'));brief['listed_files_not_uploaded_count']=len(brief.pop('listed_files_not_uploaded'))
          for phase in brief['phases'].values():
              for test in phase['tests']:test['diagnostic']=test['diagnostic'][:1000]
          print('ALPHA3_EVIDENCE_SUMMARY='+json.dumps(brief,ensure_ascii=False))
          assert not mismatches and not captures
          assert len(cases)==78 and len(screenshots)==78 and not coverage['missing'] and not coverage['skipped']
          assert all(v['actual']==v['expected'] for v in phases.values())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha3-verified-evidence-index
          path: inspection/
          retention-days: 30
          if-no-files-found: error
