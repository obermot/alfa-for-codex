
name: Nezabudka Alpha 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Nezabudka source
        uses: actions/checkout@v4
        with:
          repository: obermot/nezabudka-for-codex
          ref: 140fb1cf91afc83f4d2f74eee6cad734ace3866c
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Save unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nezabudka-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30
          if-no-files-found: warn

  emulator-tests:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Nezabudka source
        uses: actions/checkout@v4
        with:
          repository: obermot/nezabudka-for-codex
          ref: 140fb1cf91afc83f4d2f74eee6cad734ace3866c
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Enable KVM acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device is not available on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            mkdir -p alpha3-evidence
            adb logcat -b all -v threadtime > alpha3-evidence/android-logcat.txt 2>&1 &
            LOG_PID=$!
            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace
            RESULT=$?
            adb shell wm size > alpha3-evidence/display.txt
            adb shell wm density >> alpha3-evidence/display.txt
            adb shell getprop > alpha3-evidence/device-properties.txt
            adb pull /sdcard/Android/data/com.nezabudka.preview/files/device-evidence alpha3-evidence/device-evidence || true
            adb pull /sdcard/Android/data/com.nezabudka.preview.test/files/device-evidence alpha3-evidence/test-device-evidence || true
            kill "$LOG_PID" || true
            find app/build/outputs/apk -name '*.apk' -exec sha256sum {} + > alpha3-evidence/apk-sha256.txt
            git rev-parse HEAD > alpha3-evidence/source-commit.txt
            exit "$RESULT"

      - name: Save emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nezabudka-emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/apk/
            alpha3-evidence/
          retention-days: 30
          if-no-files-found: warn

