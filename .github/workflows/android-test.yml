name: Nezabudka Alpha 3
run-name: Alpha №3 — fixed application and test overlay

on:
  workflow_dispatch:
  push:
    branches: [alpha-3]
    paths: [alpha3/launch.json]

permissions:
  contents: read

concurrency:
  group: alpha3-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  preflight:
    name: Verify overlay and compile both Kotlin test suites
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run_units: ${{ steps.scope.outputs.run_units }}
    steps:
      - name: Checkout test infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false
      - name: Checkout pinned application
        uses: actions/checkout@v4
        with:
          repository: obermot/nezabudka-for-codex
          ref: 203e9e1cee402851d458b92efe822896a0042e89
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Select explicitly requested campaign scope
        id: scope
        run: |
          python3 - <<'PYTHON'
          import json, os
          scope=json.load(open('../infra/alpha3/launch.json')).get('scope','full')
          assert scope in ('full','android'), scope
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('run_units='+str(scope=='full').lower()+'\n')
          PYTHON
      - name: Verify exact patch contexts and apply test-only overlay
        id: prepare
        run: |
          python3 ci/pdf87_release_check.py
          python3 ../infra/alpha3/prepare-tests.py --source . --check-only
          python3 ../infra/alpha3/prepare-tests.py --source .
          python3 ../infra/alpha3/provenance.py
      - name: Provide the official offline model to TEST APK only
        run: |
          mkdir -p app/src/androidTest/assets
          curl --fail --location --retry 2 --max-time 300 \
            https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip \
            --output app/src/androidTest/assets/vosk-model-small-ru-0.22.zip
          python3 -m zipfile -t app/src/androidTest/assets/vosk-model-small-ru-0.22.zip
          sha256sum app/src/androidTest/assets/vosk-model-small-ru-0.22.zip > alpha3-evidence/test-model-sha256.txt
      - name: Compile Kotlin tests before enabling the full runs
        run: |
          test -d "$ANDROID_HOME"
          gradle :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin \
            :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace \
            2>&1 | tee alpha3-evidence/preflight-compile.txt
          python3 ../infra/alpha3/verify-results.py --source . --output alpha3-evidence/protected-source.json
      - name: Preserve compilation evidence and exact APKs
        if: always()
        run: python3 ../infra/alpha3/inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha3-preflight
          path: |
            source/alpha3-evidence/
            source/app/build/outputs/apk/
          retention-days: 30
          if-no-files-found: error

  unit-tests:
    if: ${{ needs.preflight.outputs.run_units == 'true' }}
    name: All 734 unit scenarios and PDF87 evidence
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false
      - name: Checkout pinned application
        uses: actions/checkout@v4
        with:
          repository: obermot/nezabudka-for-codex
          ref: 203e9e1cee402851d458b92efe822896a0042e89
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check and apply identical overlay
        id: prepare
        run: |
          python3 ../infra/alpha3/prepare-tests.py --source . --check-only
          python3 ../infra/alpha3/prepare-tests.py --source .
          python3 ../infra/alpha3/provenance.py
      - name: Execute every original unit scenario
        env:
          NEZ_STARTUP_CAPTURE_DIR: ${{ github.workspace }}/source/alpha3-evidence/startup-robolectric
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee alpha3-evidence/baseline-unit-gradle.txt
          result=${PIPESTATUS[0]}
          cp -a app/build/test-results alpha3-evidence/baseline-unit-results
          cp -a app/build/reports/tests alpha3-evidence/baseline-unit-html
          python3 ../infra/alpha3/verify-results.py --source . --suite unit \
            --results alpha3-evidence/baseline-unit-results --output alpha3-evidence/baseline-unit-coverage.json
          coverage=$?
          if (( result!=0 || coverage!=0 )); then exit 1; fi
      - name: Record actual Russian images in a separate unapproved directory
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NEZ_UI_LANGUAGE: ru
          NEZ_PDF87_CAPTURE_DIR: ${{ github.workspace }}/source/app/build/alpha3-evidence/pdf87-actual-ru
        run: |
          gradle :app:testDebugUnitTest --tests '*FinalPdf87GoldenTest' -PpdfVisualMode=record --stacktrace \
            2>&1 | tee alpha3-evidence/pdf87-actual-ru-gradle.txt
          cp -a app/build/test-results alpha3-evidence/pdf87-actual-ru-results
      - name: Record Ukrainian candidates without replacing approved references
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NEZ_UI_LANGUAGE: uk
          NEZ_PDF87_CAPTURE_DIR: ${{ github.workspace }}/source/app/build/alpha3-evidence/pdf87-candidate-uk
        run: |
          gradle :app:testDebugUnitTest --tests '*FinalPdf87GoldenTest' -PpdfVisualMode=record --stacktrace \
            2>&1 | tee alpha3-evidence/pdf87-candidate-uk-gradle.txt
          cp -a app/build/test-results alpha3-evidence/pdf87-candidate-uk-results
      - name: Record night-theme ru evidence with the existing PDF87 scenarios
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NEZ_UI_LANGUAGE: ru
          NEZ_UI_THEME: dark
          NEZ_PDF87_CAPTURE_DIR: ${{ github.workspace }}/source/app/build/alpha3-evidence/pdf87-night-ru
        run: |
          gradle :app:testDebugUnitTest --tests '*FinalPdf87GoldenTest' -PpdfVisualMode=record -PpdfGoldenDir="$PWD/app/src/test/snapshots/pdf87-night" --stacktrace \
            2>&1 | tee alpha3-evidence/pdf87-night-ru-gradle.txt
          cp -a app/build/test-results alpha3-evidence/pdf87-night-ru-results
      - name: Record night-theme uk evidence with the existing PDF87 scenarios
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NEZ_UI_LANGUAGE: uk
          NEZ_UI_THEME: dark
          NEZ_PDF87_CAPTURE_DIR: ${{ github.workspace }}/source/app/build/alpha3-evidence/pdf87-night-uk
        run: |
          gradle :app:testDebugUnitTest --tests '*FinalPdf87GoldenTest' -PpdfVisualMode=record -PpdfGoldenDir="$PWD/app/src/test/snapshots/pdf87-night" --stacktrace \
            2>&1 | tee alpha3-evidence/pdf87-night-uk-gradle.txt
          cp -a app/build/test-results alpha3-evidence/pdf87-night-uk-results
      - name: Record light English evidence with the existing PDF87 scenarios
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NEZ_UI_LANGUAGE: en
          NEZ_UI_THEME: light
          NEZ_PDF87_CAPTURE_DIR: ${{ github.workspace }}/source/app/build/alpha3-evidence/pdf87-en
        run: |
          gradle :app:testDebugUnitTest --tests '*FinalPdf87GoldenTest' -PpdfVisualMode=record --stacktrace \
            2>&1 | tee alpha3-evidence/pdf87-en-gradle.txt
          cp -a app/build/test-results alpha3-evidence/pdf87-en-results
      - name: Record dark English evidence with the existing PDF87 scenarios
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NEZ_UI_LANGUAGE: en
          NEZ_UI_THEME: dark
          NEZ_PDF87_CAPTURE_DIR: ${{ github.workspace }}/source/app/build/alpha3-evidence/pdf87-night-en
        run: |
          gradle :app:testDebugUnitTest --tests '*FinalPdf87GoldenTest' -PpdfVisualMode=record --stacktrace \
            2>&1 | tee alpha3-evidence/pdf87-night-en-gradle.txt
          cp -a app/build/test-results alpha3-evidence/pdf87-night-en-results
      - name: Check lint and application system limits
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          gradle :app:lintDebug --stacktrace 2>&1 | tee alpha3-evidence/lint-gradle.txt
          python3 ci/system_impact_audit.py
          python3 ci/ui_regex_icu_check.py
      - name: Generate actual/reference comparisons and verify protected files
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 ../infra/alpha3/verify-results.py --source . --images --output alpha3-evidence/pdf87-evidence-check.json
      - name: Inventory all evidence
        if: always()
        run: python3 ../infra/alpha3/inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha3-unit-and-pdf87
          path: |
            source/alpha3-evidence/
            source/app/build/reports/tests/
            source/app/build/reports/pdf87/
            source/app/build/test-results/
            source/app/build/alpha3-evidence/
            source/app/build/alpha3-scale-evidence/
            source/app/src/test/snapshots/pdf87/
            source/app/src/test/snapshots/pdf87-night/
          retention-days: 30
          if-no-files-found: error

  emulator-tests:
    name: All 78 Android scenarios, unresolved cases and screen matrix
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout test infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false
      - name: Checkout pinned application
        uses: actions/checkout@v4
        with:
          repository: obermot/nezabudka-for-codex
          ref: 203e9e1cee402851d458b92efe822896a0042e89
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check and apply identical overlay
        id: prepare
        run: |
          python3 ../infra/alpha3/prepare-tests.py --source . --check-only
          python3 ../infra/alpha3/prepare-tests.py --source .
          python3 ../infra/alpha3/provenance.py
      - name: Provide the same official test model
        run: |
          curl --fail --location --retry 2 --max-time 300 \
            https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip \
            --output app/src/androidTest/assets/vosk-model-small-ru-0.22.zip
          python3 -m zipfile -t app/src/androidTest/assets/vosk-model-small-ru-0.22.zip
          sha256sum app/src/androidTest/assets/vosk-model-small-ru-0.22.zip > alpha3-evidence/test-model-sha256.txt
      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Execute baseline, diagnostics and device evidence collection while emulator lives
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: source
          script: bash "$GITHUB_WORKSPACE/infra/alpha3/run-emulator.sh"
      - name: Verify protected functional source and references
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: python3 ../infra/alpha3/verify-results.py --source . --output alpha3-evidence/protected-source.json
      - name: Inventory all evidence even after failure
        if: always()
        run: python3 ../infra/alpha3/inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha3-android-and-screen-matrix
          path: |
            source/alpha3-evidence/
            source/app/build/reports/androidTests/
            source/app/build/outputs/androidTest-results/
            source/app/build/outputs/connected_android_test_additional_output/
            source/app/build/outputs/apk/
          retention-days: 30
          if-no-files-found: error
